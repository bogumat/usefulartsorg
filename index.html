<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Useful Arts</title>
  <meta name="description" content="Useful arts: the skills and methods of practical subjects such as manufacture and craftsmanship." />
  <style>
    :root {
      --beige: #ece4d1;
      --ink: #2b2a26;
      --muted: #6f6a5c;
      --orange: #ff6700;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--beige);
      color: var(--ink);
      font-family: "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 16px;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    main {
      max-width: 44ch;
      width: 100%;
    }

    .word {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin: 0 0 0.25rem;
    }

    .pos {
      color: var(--muted);
      font-style: italic;
      margin: 0 0 1.25rem;
    }

    .def {
      margin: 0;
      font-size: 1.125rem;
    }

    .def::before {
      content: "1. ";
      color: var(--orange);
    }

    .dot {
      display: inline-block;
      width: 0.6em;
      height: 0.6em;
      margin-left: 0.35em;
      border-radius: 50%;
      background: var(--orange);
      vertical-align: baseline;
      animation: blink 1.1s steps(1, end) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="word">useful arts</p>
    <p class="pos">noun</p>
    <p class="def">the skills and methods of practical subjects such as manufacture and craftsmanship.<span class="dot" aria-hidden="true"></span></p>
  </main>
</body>
</html>
